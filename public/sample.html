<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡 script 引用範例</title>
    <link rel="stylesheet" href="./embed/product-card.css">
  </head>
  <body>
    <h1>商品卡 script 引用範例</h1>
    <p>本頁提供自己的商品資料，透過 script 掛載與 Showroom 共用的商品卡。</p>
    <div id="product-card"></div>

    <script src="./embed/product-card.iife.js"></script>
    <script>
      // 修改這份資料即可呈現自己的商品，不讀取 Showroom 存檔。
      const product = {
        name: '輕量無線耳罩式耳機',
        imageUrl: 'https://cdn.dummyjson.com/product-images/mobile-accessories/apple-airpods-max-silver/1.webp',
        price: 599,
        promotion: '限時優惠',
        originalPrice: 1299,
        rating: 4.5,
        reviewCount: 168,
        salesCount: 3000,
        badges: ['速達', '折價券', '贈品'],
      }
      const container = document.getElementById('product-card')
      const result = MomoCard.mountProductCard(container, product)
      if (!result.ok) {
        container.textContent = '商品資料不正確，無法顯示'
        console.error(result.errors)
      }
    </script>
  </body>
</html>
