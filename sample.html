<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡獨立引用範例</title>
    <link rel="stylesheet" href="./embed/product-card.css">
  </head>
  <body class="mc:m-[24px] mc:text-[#263547] mc:bg-[#f6f8fa] mc:[font-family:Georgia,serif]">
    <main class="mc:max-w-[1000px] mc:mx-auto">
      <a href="./">← 回到 Showroom</a>
      <h1 class="mc:text-[24px]">商品卡獨立引用範例</h1>
      <p>這是一個獨立 HTML，只引用商品卡的正式 JS／CSS。資料由本頁提供，不讀取 Showroom 存檔。</p>
      <div class="mc:grid mc:grid-cols-[repeat(auto-fit,minmax(min(100%,280px),1fr))] mc:gap-[32px] mc:my-[28px]">
        <div><div id="product-card" class="mc:box-border mc:max-w-[280px] mc:p-[10px] mc:bg-[#fff]"></div></div>
        <section class="mc:min-w-0 mc:[line-height:1.8]" aria-labelledby="usage-heading">
          <h2 id="usage-heading">如何使用</h2>
          <ol>
            <li>在自己的頁面載入商品卡 CSS 與 script。</li>
            <li>準備一個容器，呼叫 <code>MomoCard.mountProductCard</code> 並傳入商品資料。</li>
            <li>要使用你編輯的內容，回到 Showroom 儲存，再按「複製 HTML」。</li>
          </ol>
          <p>以下是本頁實際使用的資料與引用方式。599 元為獨立示範值，並非你的存檔。</p>
          <pre class="mc:overflow-auto mc:max-h-[390px] mc:p-[16px] mc:bg-[#e9edf2] mc:text-[12px] mc:[line-height:1.8] mc:[font-family:monospace]"><code id="usage"></code></pre>
          <p>發布到其他網站時，請一併提供 JS／CSS，並調整引用路徑及圖片網址。</p>
        </section>
      </div>
    </main>
    <script src="./embed/product-card.iife.js"></script>
    <script>
      const container = document.getElementById('product-card')
      const product = {
        name: '【示範商品】輕量無線耳罩式耳機 藍牙 5.3／40 小時續航／霧灰色',
        imageUrl: new URL('./headphones.svg', window.location.href).href,
        price: 599,
        promotion: '限時優惠・本頁獨立示範',
        originalPrice: 1299,
        rating: 4.8,
        reviewCount: 168,
        salesCount: 3000,
        badges: ['速達', '折價券', '贈品'],
      }
      const result = MomoCard.mountProductCard(container, product)
      if (!result.ok) container.textContent = '商品資料不正確，無法掛載'
      const cssUrl = document.querySelector('link[rel="stylesheet"]').href
      const jsUrl = document.querySelector('script[src$="product-card.iife.js"]').src
      document.getElementById('usage').textContent = [
        `<link rel="stylesheet" href="${cssUrl}">`,
        '<div id="card"></div>',
        `<script src="${jsUrl}"><\/script>`,
        '<script>',
        `  const product = ${JSON.stringify(product, null, 2)}`,
        "  const result = MomoCard.mountProductCard(document.getElementById('card'), product)",
        '<\/script>',
      ].join('\n')
    </script>
  </body>
</html>
